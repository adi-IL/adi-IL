name: profile
on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch: {}
permissions: {}
concurrency:
  group: profile
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s profile -p "test_*.py"
      - run: python3 profile/build.py --out .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 profile/commit.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
